<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Без названия</title>
<style>
  @page { size: landscape; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #1e1e1e; }
  .canvas { position: relative; width: 1080px; height: 1720px; }
  .node { position: absolute; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
  .node-text { overflow: hidden; background: #e7f5ff; border: 1px solid #1971c2; }
  .node a { color: #1971c2; text-decoration: none; }
  .node a:hover { text-decoration: underline; color: #1864ab; }
  .node-text.color-1 { background: #ffc9c9; border-color: #e03131; }
  .node-text.color-2 { background: #ffe8cc; border-color: #e8590c; }
  .node-text.color-3 { background: #e5dbff; border-color: #7950f2; }
  .node-text.color-4 { background: #b2f2bb; border-color: #2f9e44; }
  .node-text.color-5 { background: #d0ebff; border-color: #1c7ed6; }
  .node-text.color-6 { background: #fcc2d7; border-color: #c2255c; }
  .node-group { background: rgba(134,142,150,0.06); border: 1.5px dashed #868e96; border-radius: 10px; padding: 0; overflow: visible; }
  .group-label { position: absolute; top: -24px; left: 12px; font-size: 18px; font-weight: 600; color: #868e96; background: #ffffff; padding: 0 6px; white-space: nowrap; }
  .node h1, .node h2 { font-size: 13px; margin-bottom: 4px; color: #e67700; }
  .node em { color: #666; font-style: italic; }
  .node strong { color: #333; }
  .node ul { margin-left: 14px; font-size: 11px; }
  .node ul li { margin-bottom: 2px; }
  svg.edges { position: absolute; top: 0; left: 0; width: 1080px; height: 1720px; pointer-events: none; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
<svg class="edges" id="edges"></svg>
</div>
<script>
const OX = 1600;
const OY = 2060;
const canvasData = {"nodes":[{"id":"5725655b3abd779d","type":"text","text":"","styleAttributes":{},"x":-1220,"y":-840,"width":260,"height":60},{"id":"899d5f1dc5067365","type":"text","text":"","styleAttributes":{},"x":-1420,"y":-480,"width":260,"height":60},{"id":"d7ffbdf68cc10dcd","type":"text","text":"","styleAttributes":{},"x":-1520,"y":-1500,"width":260,"height":60},{"id":"82d15bd8d1199bd8","type":"text","text":"","styleAttributes":{},"x":-860,"y":-1980,"width":260,"height":60}],"edges":[{"id":"09574fc6fd44f238","styleAttributes":{},"toFloating":false,"fromFloating":false,"fromNode":"5725655b3abd779d","fromSide":"bottom","toNode":"899d5f1dc5067365","toSide":"top"}],"metadata":{"version":"1.0-1.0","frontmatter":{}}};
const nodeMap = {};
canvasData.nodes.forEach(n => { nodeMap[n.id] = n; });

function md(text) {
  return text
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/(?<!href=")(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/^\* (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g, '')
    .replace(/\n/g, '<br>')
    .replace(/<br>\s*(<\/?[uo]l>|<li>)/g, '$1')
    .replace(/(<\/?[uo]l>|<\/li>)\s*<br>/g, '$1');
}

const canvas = document.getElementById('canvas');

canvasData.nodes.filter(n => n.type === 'group').forEach(n => {
  const div = document.createElement('div');
  div.className = 'node node-group';
  if (n.color && n.color.startsWith('#')) { div.style.borderColor = n.color; }
  div.style.left = (n.x + OX) + 'px';
  div.style.top = (n.y + OY) + 'px';
  div.style.width = n.width + 'px';
  div.style.height = n.height + 'px';
  if (n.label) { const lbl = document.createElement('span'); lbl.className = 'group-label'; lbl.textContent = n.label; div.appendChild(lbl); }
  canvas.appendChild(div);
});

canvasData.nodes.filter(n => n.type !== 'group').forEach(n => {
  const div = document.createElement('div');
  const isHex = n.color && n.color.startsWith('#');
  div.className = 'node node-text' + (n.color && !isHex ? ' color-' + n.color : '');
  if (isHex) { div.style.borderColor = n.color; }
  div.style.left = (n.x + OX) + 'px';
  div.style.top = (n.y + OY) + 'px';
  div.style.width = n.width + 'px';
  div.style.height = n.height + 'px';
  if (n.type === 'text') {
    div.innerHTML = md(n.text);
  } else if (n.type === 'file') {
    const fname = n.file.split('/').pop();
    div.innerHTML = '\ud83d\udcc4 ' + fname + (n.subpath ? ' ' + n.subpath : '');
  } else if (n.type === 'link') {
    div.innerHTML = '<div style="font-size:10px;opacity:0.5;margin-bottom:2px">[embedded URL]</div>' +
      '<a href="' + n.url + '" target="_blank">' + n.url + '</a>';
  }
  canvas.appendChild(div);
});

const svg = document.getElementById('edges');
canvasData.edges.forEach(e => {
  const from = nodeMap[e.fromNode];
  const to = nodeMap[e.toNode];
  if (!from || !to) return;
  function anchor(node, side) {
    const x = node.x + OX, y = node.y + OY;
    switch(side) {
      case 'top': return {x: x+node.width/2, y};
      case 'bottom': return {x: x+node.width/2, y: y+node.height};
      case 'left': return {x, y: y+node.height/2};
      case 'right': return {x: x+node.width, y: y+node.height/2};
      default: return {x: x+node.width/2, y: y+node.height/2};
    }
  }
  const p1 = anchor(from, e.fromSide);
  const p2 = anchor(to, e.toSide);
  let cp1, cp2;
  if (e.fromSide === 'bottom' && e.toSide === 'top') {
    const off = Math.min(Math.abs(p2.y-p1.y)*0.5, 60);
    cp1 = {x:p1.x, y:p1.y+off}; cp2 = {x:p2.x, y:p2.y-off};
  } else if (e.fromSide === 'right' && e.toSide === 'left') {
    const off = Math.min(Math.abs(p2.x-p1.x)*0.4, 80);
    cp1 = {x:p1.x+off, y:p1.y}; cp2 = {x:p2.x-off, y:p2.y};
  } else {
    const dx=p2.x-p1.x, dy=p2.y-p1.y;
    cp1 = {x:p1.x+dx*0.3, y:p1.y+dy*0.3}; cp2 = {x:p1.x+dx*0.7, y:p1.y+dy*0.7};
  }
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M '+p1.x+' '+p1.y+' C '+cp1.x+' '+cp1.y+', '+cp2.x+' '+cp2.y+', '+p2.x+' '+p2.y);
  path.setAttribute('stroke','#868e96');
  path.setAttribute('stroke-width','1.5');
  path.setAttribute('fill','none');
  path.setAttribute('opacity','0.6');
  const angle = Math.atan2(p2.y-cp2.y, p2.x-cp2.x);
  const al=8;
  const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  arrow.setAttribute('points', p2.x+','+p2.y+' '+(p2.x-al*Math.cos(angle-0.4))+','+(p2.y-al*Math.sin(angle-0.4))+' '+(p2.x-al*Math.cos(angle+0.4))+','+(p2.y-al*Math.sin(angle+0.4)));
  arrow.setAttribute('fill','#868e96');
  arrow.setAttribute('opacity','0.6');
  svg.appendChild(path);
  svg.appendChild(arrow);
});
</script>
</body>
</html>
